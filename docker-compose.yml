networks:
  cbo_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  db:
    image: postgres:16.15-alpine
    container_name: cbo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cbo_players_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cbo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cbo_players_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: cbo-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://cbo-db:5432/${POSTGRES_DB:-cbo_players_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SCRAPER_BASE_URL: http://scraper:3000
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-cbo_secret_scraping_key_12345}
      SCRAPER_CONNECT_TIMEOUT_MS: ${SCRAPER_CONNECT_TIMEOUT_MS:-3000}
      SCRAPER_READ_TIMEOUT_MS: ${SCRAPER_READ_TIMEOUT_MS:-90000}
      CATALOG_SYNC_ENABLED: ${CATALOG_SYNC_ENABLED:-true}
      CATALOG_SYNC_CRON: "${CATALOG_SYNC_CRON:-0 0 15 * * MON}"
      CATALOG_SYNC_ZONE: ${CATALOG_SYNC_ZONE:-America/Argentina/Buenos_Aires}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - cbo_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  scraper:
    build:
      context: ./scraping
      dockerfile: Dockerfile
    container_name: cbo-scraper
    restart: unless-stopped
    environment:
      PORT: 3000
      API_KEY: ${SCRAPER_API_KEY:-cbo_secret_scraping_key_12345}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY}
      SCRAPE_TIMEOUT_MS: ${SCRAPE_TIMEOUT_MS:-15000}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      MAX_CONCURRENT_SCRAPES: ${MAX_CONCURRENT_SCRAPES:-2}
    ports:
      - "${SCRAPER_PORT:-3000}:3000"
    networks:
      - cbo_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


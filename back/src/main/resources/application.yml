spring:
  application:
    name: players-market
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cbo_players_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never

app:
  catalog-sync:
    enabled: ${CATALOG_SYNC_ENABLED:false}
    cron: ${CATALOG_SYNC_CRON:0 0 15 * * MON}
    zone: ${CATALOG_SYNC_ZONE:America/Argentina/Buenos_Aires}
  scraper:
    base-url: ${SCRAPER_BASE_URL:http://localhost:3000}
    api-key: ${SCRAPER_API_KEY:}
    connect-timeout-ms: ${SCRAPER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${SCRAPER_READ_TIMEOUT_MS:90000}
  security:
    jwt:
      secret: ${JWT_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlX2tleV9mb3Jfand0X3NpZ25pbmdfMjU2X2JpdHNfc2VjcmV0}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080
  error:
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

spring:
    application:
        name: players-market
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/cbo_players_db}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:}
        driver-class-name: org.postgresql.Driver
    jpa:
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: update
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
        show-sql: false
    sql:
        init:
            mode: never
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            timeout: 2000ms

app:
    demo-seed:
        enabled: ${DEMO_SEED_ENABLED:true}
    catalog-sync:
        enabled: ${CATALOG_SYNC_ENABLED:false}
        cron: ${CATALOG_SYNC_CRON:0 0 15 * * MON}
        zone: ${CATALOG_SYNC_ZONE:America/Argentina/Buenos_Aires}
    scraper:
        base-url: ${SCRAPER_BASE_URL:http://localhost:3000}
        api-key: ${SCRAPER_API_KEY:}
        connect-timeout-ms: ${SCRAPER_CONNECT_TIMEOUT_MS:3000}
        read-timeout-ms: ${SCRAPER_READ_TIMEOUT_MS:90000}
    security:
        jwt:
            secret: ${JWT_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlX2tleV9mb3Jfand0X3NpZ25pbmdfMjU2X2JpdHNfc2VjcmV0}
            expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    cache:
        ttl:
            default-minutes: ${CACHE_TTL_DEFAULT_MINUTES:30}
            ranking-minutes: ${CACHE_TTL_RANKING_MINUTES:60}
            catalog-minutes: ${CACHE_TTL_CATALOG_MINUTES:15}
            external-minutes: ${CACHE_TTL_EXTERNAL_MINUTES:30}

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus
    endpoint:
        health:
            show-details: always
            probes:
                enabled: true
        prometheus:
            enabled: true
    info:
        env:
            enabled: true
    metrics:
        tags:
            application: ${spring.application.name}

info:
    app:
        name: ${spring.application.name}
        version: 3.0.0
        description: Plataforma de Mercado y Valoración de Jugadores de Fútbol - Entrega 3

server:
    port: 8080
    error:
        include-stacktrace: never

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: alpha

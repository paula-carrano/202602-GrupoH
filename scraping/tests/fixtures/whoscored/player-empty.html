<!DOCTYPE html>
<html>
<head><title>New Player - WhoScored</title></head>
<body>
<div id="player-profile">
  <div class="player-header">
    <h1>Young Player</h1>
  </div>
  <table id="top-player-stats-summary-grid">
    <thead>
      <tr>
        <th>Apps</th>
        <th>Mins</th>
        <th>Goals</th>
        <th>Assists</th>
        <th>Yel</th>
        <th>Red</th>
        <th>SpG</th>
        <th>PS%</th>
        <th>AerialsWon</th>
        <th>MotM</th>
        <th>Rating</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
      </tr>
    </tbody>
  </table>

  <div id="statistics-table-offensive">
    <table>
      <tbody>
        <tr>
          <td class="shots">-</td>
          <td class="key-passes">-</td>
          <td class="dribbles">-</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="statistics-table-defensive">
    <table>
      <tbody>
        <tr>
          <td class="tackles">-</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
